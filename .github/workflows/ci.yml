name: CI

# Run validation whenever code is pushed or a pull request is opened.
on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    steps:
      # Download the repository into the GitHub Actions runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Use the Node.js version expected by the project.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # npm ci installs exactly what is recorded in package-lock.json.
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # Verify that the TypeScript backend compiles without emitting files.
      - name: Typecheck backend
        working-directory: backend
        run: npx tsc --noEmit

      # Verify that the actual production build succeeds.
      - name: Build backend
        working-directory: backend
        run: npm run build

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      # Download the repository into the GitHub Actions runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configure Node.js and dependency caching for the frontend.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Install the exact frontend dependency versions.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Run the project's ESLint configuration.
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      # Vite's production build also verifies the frontend TypeScript build.
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy backend to Azure
    runs-on: ubuntu-latest

    # Wait until both CI jobs succeed.
    needs:
      - backend
      - frontend
    
    # Deploy only pushes to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      # Download the repository.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Use the same Node.js version as Azure App Service.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Install dependencies needed to compile TypeScript.
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # Compile TypeScript into dist/.
      - name: Build backend
        working-directory: backend
        run: npm run build

      # Create a deployment ZIP containing the CONTENTS
      # of backend/, not the backend/ directory itself.
      #
      # This ensures package.json is at the root of the ZIP
      # so Azure Oryx can detect the Node.js application.
      - name: Create backend deployment package
        working-directory: backend
        run: |
          zip -r ../backend-deploy.zip . \
            -x "node_modules/*" \
            -x ".env" \
            -x ".env.*"

      # Deploy the ZIP package to Azure App Service.
      - name: Deploy backend
        uses: azure/webapps-deploy@v3
        with:
          app-name: zohaib-portfolio-rag
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: ./backend-deploy.zip