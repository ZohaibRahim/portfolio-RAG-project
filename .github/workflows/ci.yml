name: CI

# Run validation whenever code is pushed or a pull request is opened.
on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    steps:
      # Download the repository into the GitHub Actions runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Use the Node.js version expected by the project.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # npm ci installs exactly what is recorded in package-lock.json.
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # Verify that the TypeScript backend compiles without emitting files.
      - name: Typecheck backend
        working-directory: backend
        run: npx tsc --noEmit

      # Verify that the actual production build succeeds.
      - name: Build backend
        working-directory: backend
        run: npm run build

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      # Download the repository into the GitHub Actions runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configure Node.js and dependency caching for the frontend.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Install the exact frontend dependency versions.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Run the project's ESLint configuration.
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      # Vite's production build also verifies the frontend TypeScript build.
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy backend to Azure
    runs-on: ubuntu-latest

    # Deployment only starts after BOTH CI jobs succeed.
    needs:
      - backend
      - frontend

    # Never deploy pull requests or non-main branches.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      # Download the repository again because each job
      # runs on its own clean GitHub Actions machine.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Use the same Node version as Azure App Service.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Install dependencies so we can create the compiled dist/ directory.
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # Compile src/*.ts into production JavaScript under dist/.
      - name: Build backend
        working-directory: backend
        run: npm run build

      # Deploy ONLY the backend folder to Azure App Service.
      - name: Deploy backend
        uses: azure/webapps-deploy@v3
        with:
          app-name: zohaib-portfolio-rag
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: ./backend